services:
  micro_ros_agent:
    build:
      context: ./micro_ros_agent
      dockerfile: Dockerfile
    image: vida-micro-ros-agent:humble
    container_name: micro_ros_agent
    restart: unless-stopped
    network_mode: host
    ipc: host
    devices:
      - /dev/vida_esp32:/dev/vida_esp32
    command: ["serial", "--dev", "/dev/vida_esp32", "-b", "921600", "-v3"]
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}


  ros2_ws:
    build:
      context: ./ros_ws
      dockerfile: Dockerfile
    image: vida-ros2-ws:humble
    container_name: ros2_ws
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      FASTRTPS_DEFAULT_PROFILES_FILE: /etc/fastdds/udp-only.xml
    stdin_open: true
    tty: true
    volumes:
      - ./ros_ws/config/fastdds_udp.xml:/etc/fastdds/udp-only.xml:ro
    devices:
      - /dev/vida_ublox:/dev/vida_ublox
    command:
      - bash
      - -lc
      - >-
        source /opt/ros/humble/setup.bash &&
        source /vida_ws/install/setup.bash &&
        exec ros2 launch vida_odroid vida.launch.py
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
